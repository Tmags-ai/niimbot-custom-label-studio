function textAlignment(value){
 return ['left','center','right','justify'].includes(value)?value:'left';
}
function drawLayerText(g,el,left,top,w,h){
 const lines=String(el.text||'').split(/\r\n?|\n/);
 const desiredFs=Math.max(.5,Number(el.size)||.5)*300/72;
 const setFont=fs=>{g.font=(el.bold?'bold ':'')+fs+'px "'+(el.font||'Arial')+'"';};
 setFont(desiredFs);
 const widest=Math.max(1,...lines.map(line=>g.measureText(line||' ').width));
 // Fit the text uniformly in the layer in either label orientation.
 const fs=desiredFs*Math.min(1,Math.max(.01,w)/widest,Math.max(.01,h)/(lines.length*desiredFs*1.15));
 setFont(fs);
 const align=textAlignment(el.align);
 g.textBaseline='top';
 g.textAlign=align==='justify'?'left':align;
 const x=left+w*({center:.5,right:1}[align]??0);
 const lastLine=lines.findLastIndex(line=>line.trim());
 lines.forEach((line,i)=>{
  const y=top+i*fs*1.15;
  if(align==='justify'&&i<lastLine){
   const words=line.trim().split(/\s+/);
   if(words.length>1){
    const widths=words.map(word=>g.measureText(word).width);
    const gap=(w-widths.reduce((sum,width)=>sum+width,0))/(words.length-1);
    if(gap>=0){
     let wordX=left;
     words.forEach((word,j)=>{g.fillText(word,wordX,y);wordX+=widths[j]+gap;});
     return;
    }
   }
  }
  g.fillText(line,x,y);
 });
 return fs;
}

 const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);

 }

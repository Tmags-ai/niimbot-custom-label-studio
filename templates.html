function textAlignment(value){
 return ['left','center','right','justify'].includes(value)?value:'left';
}
function drawLayerText(g,el,left,top,w,h){
 const lines=String(el.text||'').split(/\r\n?|\n/);
 const desiredFs=Math.max(.5,Number(el.size)||.5)*300/72;
 const setFont=fs=>{g.font=(el.bold?'bold ':'')+fs+'px "'+(el.font||'Arial')+'"';};
 setFont(desiredFs);
 const widest=Math.max(1,...lines.map(line=>g.measureText(line||' ').width));
 // Fit the text uniformly in the layer in either label orientation.
 const fs=desiredFs*Math.min(1,Math.max(.01,w)/widest,Math.max(.01,h)/(lines.length*desiredFs*1.15));
 setFont(fs);
 const align=textAlignment(el.align);
 g.textBaseline='top';
 g.textAlign=align==='justify'?'left':align;
 const x=left+w*({center:.5,right:1}[align]??0);
 const lastLine=lines.findLastIndex(line=>line.trim());
 lines.forEach((line,i)=>{
  const y=top+i*fs*1.15;
  if(align==='justify'&&i<lastLine){
   const words=line.trim().split(/\s+/);
   if(words.length>1){
    const widths=words.map(word=>g.measureText(word).width);
    const gap=(w-widths.reduce((sum,width)=>sum+width,0))/(words.length-1);
    if(gap>=0){
     let wordX=left;
     words.forEach((word,j)=>{g.fillText(word,wordX,y);wordX+=widths[j]+gap;});
     return;
    }
   }
  }
  g.fillText(line,x,y);
 });
 return fs;
}

for(const entry of templates){
 const card=document.createElement('article');card.className='card';
 const heading=document.createElement('h2');heading.textContent=entry.name;
 const portrait=entry.orientation==='portrait',width=Number(entry.project.width),height=Number(entry.project.height);
 const [viewWidth,viewHeight]=portrait?[height,width]:[width,height];
 const orientation=document.createElement('p');orientation.textContent=(portrait?'Portrait':'Landscape')+' · '+viewWidth+' × '+viewHeight+' mm view';
 const sample=document.createElement('div');sample.className='sample';
 const canvas=document.createElement('canvas');canvas.width=Math.round(viewWidth*300/25.4);canvas.height=Math.round(viewHeight*300/25.4);
 canvas.setAttribute('aria-label',entry.name+' layout preview');canvas.setAttribute('role','img');sample.append(canvas);
 async function renderPreview(){
 await document.fonts.ready;
 const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
 for(const layer of entry.project.items){
  const [x,y,w,h]=[layer.x*canvas.width/100,layer.y*canvas.height/100,layer.w*canvas.width/100,layer.h*canvas.height/100];
  ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate((layer.rotate||0)*Math.PI/180);
  ctx.fillStyle=ctx.strokeStyle=layer.ribbon==='white'?'white':layer.ribbon==='blue'?'#286fba':'black';
  if(layer.type==='text')drawLayerText(ctx,layer,-w/2,-h/2,w,h);
  if(layer.type==='image'){
   const image=new Image();image.src=layer.src;
   try{await image.decode();ctx.drawImage(image,-w/2,-h/2,w,h);}catch{}
  }
  if(layer.type==='box'){
   ctx.lineWidth=(layer.strokeWidthMm||.05)*300/25.4;
   ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,Math.min(w,h)*(layer.radius||0)/100);
   if(layer.fill==='black')ctx.fill();
   ctx.stroke();
  }
  ctx.restore();
 }
 }
 void renderPreview();
 const link=document.createElement('a');link.className='download';link.textContent='Download editable JSON';
 link.setAttribute('aria-label','Download '+entry.name+' editable JSON');link.download=entry.filename;
 link.href=URL.createObjectURL(new Blob([JSON.stringify(entry.project,null,2)],{type:'application/json'}));
 if(entry.vialLinked){
  const note=document.createElement('p');note.textContent='Vial Calc linked. Change the vial values to update the label.';
  card.append(heading,orientation,note,sample,link);
 }else card.append(heading,orientation,sample,link);document.getElementById('templates-'+width).append(card);
}
